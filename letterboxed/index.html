<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Letter Boxed Unlimited</title>
  <meta name="description" content="Connect letters around the box to use all twelve. Endless puzzles.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Libre+Franklin:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/letterboxed/letterboxed.css">
</head>
<body>
  <header class="topbar">
    <a class="home" href="/" aria-label="Back to home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      <span class="home-label">Home</span>
    </a>
    <h1>Letter Boxed</h1>
    <div class="actions">
      <button class="pill small" id="new-btn">New puzzle</button>
    </div>
  </header>

  <main class="lb">
    <section class="entry">
      <div class="current" id="current" aria-live="polite"></div>
      <div class="played" id="played"></div>
      <p class="par" id="par"></p>
    </section>

    <section class="box-wrap">
      <svg class="box" id="box" viewBox="0 0 300 300" role="group" aria-label="Letter box"></svg>
    </section>

    <div class="controls">
      <button class="pill" id="restart-btn">Restart</button>
      <button class="pill" id="delete-btn">Delete</button>
      <button class="pill" id="enter-btn">Enter</button>
    </div>
    <button class="link-btn" id="giveup-btn">See our solution</button>
  </main>

  <div class="toast-wrap" id="toasts"></div>

  <div class="modal-backdrop" id="modal">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="close" id="modal-close" aria-label="Close">&times;</button>
      <h2 id="modal-title">Puzzle solved!</h2>
      <p id="modal-sub"></p>
      <p class="solution" id="modal-solution"></p>
      <div class="stats" id="stats"></div>
      <div class="buttons">
        <button class="pill" id="share-btn">Share</button>
        <button class="pill solid" id="modal-next">Next Puzzle</button>
      </div>
    </div>
  </div>

  <script src="/common.js"></script>
  <script src="/words/common.js"></script>
  <script src="/letterboxed/letterboxed.js"></script>
</body>
</html>
